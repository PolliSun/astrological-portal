<section id="name-section" class="page__section name">
  <h2 class="page__section-title">Толкование имени</h2>

  <div class="name__content">
    <input
      type="text"
      id="name-input"
      class="name__content-input"
      placeholder="Введите ваше имя..."
    />
    <button class="name__content-button">Узнать значение</button>

    <div class="display display-name">
      <h3 class="display-title">
        Вводите имя только на русском языке, используя кириллицу, без цифр и
        специальных символов.
      </h3>
      <p class="display-description"></p>
    </div>
  </div>
</section>
