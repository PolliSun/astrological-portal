<div class="blog__forum">
    <div class="blog__forum-title">
        <p class="blog__forum-text">Таро</p>
        <div class="blog__forum-info">
            <p class="blog__forum-date"></p>
            <p class="blog__forum-count"></p>
        </div>
    </div>
    <ul class="blog__forum-messages">
        <template id="message-template">
            <li class="blog__forum-item">
                <div class="blog__forum-block">
                    <p class="blog__forum-name"></p>
                    <p class="blog__forum-message"></p>
                </div>
                <div class="blog__forum-block2">
                    <button class="blog__forum-like button">
                        <img class="blog__forum-icon" src="../../vendor/images/icons/like.svg" alt="like">
                        <span class="blog__forum-like-counter"></span>
                    </button>
                    <button class="blog__forum-reply button">Ответить</button>
                    <button class="blog__forum-like button">Пожаловаться</button>
                </div>
            </li>
        </template>
